# ───────────────────────────────────────────────────────────────────────────────────────────────────────────
# Public entry for the ePESO employer portal.  The Cloudflare tunnel points HERE (http://localhost:8081) — NEVER at
# your normal XAMPP site (port 8080): that one serves everything under C:\xampp\htdocs (your other projects, the
# backend's .git folder, uploads, backups ...).
#
# This virtual host serves ONLY:
#   1. the built employer page          (C:\xampp\htdocs\epeso_employer_public, made by scripts\deploy-employer.ps1)
#   2. the two employer API modules     (/epeso_backend/api/employer_auth/...  and  /epeso_backend/api/employer_portal/...)
# Every other path answers "not found" at this layer, before the PHP code even runs. (The backend itself ALSO refuses
# staff, kiosk and every other route for requests that arrive through Cloudflare: core/public_gate.php. Two locks.)
#
# Install: copy this file to C:\xampp\apache\conf\extra\httpd-employer.conf, add the line
#            Include conf/extra/httpd-employer.conf
#          at the END of C:\xampp\apache\conf\httpd.conf, and restart Apache from the XAMPP control panel.
#          Also set  ServerTokens Prod  in httpd.conf (Apache then stops announcing its own and PHP's version in every response).
#          Check the result:   http://localhost:8081/employer/   (the sign-in page)
# ───────────────────────────────────────────────────────────────────────────────────────────────────────────

# Only this computer may connect (the Cloudflare tunnel program runs on the same server). Nothing on the office
# network or the internet can reach this port directly.
Listen 127.0.0.1:8081

<VirtualHost 127.0.0.1:8081>
    ServerName employers.local
    ServerSignature Off
    DocumentRoot "C:/xampp/htdocs/epeso_employer_public"

    # ── the built employer page (static files only) ──
    <Directory "C:/xampp/htdocs/epeso_employer_public">
        Options -Indexes -ExecCGI -FollowSymLinks
        AllowOverride None
        Require all granted
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>
    RedirectMatch 302 "^/$" "/employer/"

    # ── the backend: ONLY index.php, ONLY reachable for the two employer modules below ──
    <Directory "C:/xampp/htdocs/epeso_backend">
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all denied
        <Files "index.php">
            Require all granted
        </Files>
    </Directory>
    AliasMatch "^/epeso_backend/api/(employer_auth|employer_portal)(/.*)?$" "C:/xampp/htdocs/epeso_backend/index.php"

    # Browser hardening for everything served here.
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "no-referrer"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        Header unset X-Powered-By
        Header always unset X-Powered-By
    </IfModule>
</VirtualHost>
